name: MoonSeal CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.3+16975d007
          core-version: 0.10.3+16975d007

      - name: Show toolchain
        run: moon version --all

      - name: Run moon check
        run: moon check --target js

      - name: Run moon build
        run: moon build --target js

      - name: Run formatting and interface checks
        run: |
          moon fmt --check
          moon info
          git diff --ignore-all-space --exit-code

      - name: Run moon test
        run: moon test --target js

      - name: Run structural quality gate examples
        run: |
          moon run --target js cmd/main -- scan fixtures/well_tested
          moon run --target js cmd/main -- gate fixtures/well_tested
          moon run --target js cmd/main -- gate fixtures/untested
          moon run --target js cmd/main -- mutants fixtures/mutation_targets
          moon run --target js cmd/main -- explain fixtures/well_tested
          moon run --target js cmd/main -- api fixtures/well_tested
          moon run --target js cmd/main -- manifest fixtures/well_tested

      - name: Run dynamic mutation and coverage gate
        run: moon run --target js cmd/main -- gate fixtures/well_tested --mutate --coverage

      - name: Run baseline and integration fixture checks
        run: |
          moon run --target js cmd/main -- gate fixtures/realistic_project
          moon run --target js cmd/main -- compare fixtures/realistic_project --baseline fixtures/realistic_project/moonseal-baseline.json
          moon run --target js cmd/main -- sarif fixtures/untested --output _build/untested.sarif
          moon run --target js cmd/main -- trend fixtures/realistic_project --history _build/quality-history.json
